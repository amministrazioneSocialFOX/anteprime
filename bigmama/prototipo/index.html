<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Anteprima SocialFOX</title>
<style>
/* Viewer SocialFOX: mostra pagina.html come telefono o come computer, da qualsiasi schermo. */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#151515;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left));background:#151515;border-bottom:1px solid #2a2a2a}
.brand{font-weight:700;font-size:13px}
.brand b{color:#1BD660}
.switch{display:flex;background:#2a2a2a;border-radius:999px;padding:4px;gap:4px}
.switch button{border:0;background:transparent;color:#ddd;font:600 14px system-ui,sans-serif;padding:10px 16px;border-radius:999px;cursor:pointer;min-height:44px}
.switch button[aria-pressed="true"]{background:#1BD660;color:#151515}
.switch button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.stage{flex:1;overflow:hidden;display:flex;justify-content:center;align-items:flex-start;padding:16px}
.frame{background:#fff;overflow:hidden;transform-origin:top left;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.frame.phone{border-radius:28px;border:10px solid #000}
.frame.pc{border-radius:8px;border:1px solid #444}
iframe{border:0;display:block;width:100%;height:100%;background:#fff}
.hint{font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="top">
  <span class="brand">Prototipo <b>SocialFOX</b> · <span id="nome">anteprima</span></span>
  <div class="switch" role="group" aria-label="Scegli la vista">
    <button id="b-tel" type="button" aria-pressed="false">📱 Telefono</button>
    <button id="b-pc" type="button" aria-pressed="false">💻 Computer</button>
  </div>
  <span class="hint" id="hint"></span>
</div>
<div class="stage" id="stage">
  <div class="frame" id="frame"><iframe id="pg" title="Anteprima"></iframe></div>
</div>
<script>
(function(){
  var W={tel:390,pc:1280};
  /* ?p=p5 apre una versione precisa (p5.html); senza = pagina.html (la definitiva). Giovanni 09/11 */
  var q=(location.search.match(/[?&]p=([a-z0-9-]+)/i)||[])[1];
  /* 17/11: l'ora in fondo all'indirizzo obbliga il browser a prendere sempre l'ultima versione, non quella in memoria */
  document.getElementById('pg').src=(q?(q+'.html'):'pagina.html')+'?v='+Date.now();
  var stage=document.getElementById('stage'),frame=document.getElementById('frame');
  var bt=document.getElementById('b-tel'),bp=document.getElementById('b-pc'),hint=document.getElementById('hint');
  var mode=(location.hash==='#computer')?'pc':(location.hash==='#telefono')?'tel':(window.innerWidth>=900?'pc':'tel');
  function fit(){
    var pad=32,availW=stage.clientWidth-pad,availH=stage.clientHeight-pad;
    var w=W[mode],extra=(mode==='tel')?20:2;
    var s=Math.min(1,availW/(w+extra));
    frame.className='frame '+(mode==='tel'?'phone':'pc');
    frame.style.width=w+'px';
    frame.style.height=Math.max(300,Math.floor(availH/s))+'px';
    frame.style.transform='scale('+s+')';
    frame.style.marginRight=(-(w+extra)*(1-s))+'px';
    hint.textContent=s<1?('vista rimpicciolita al '+Math.round(s*100)+'%'):'';
    bt.setAttribute('aria-pressed',mode==='tel');bp.setAttribute('aria-pressed',mode==='pc');
  }
  function set(m){mode=m;try{history.replaceState(null,'',m==='pc'?'#computer':'#telefono');}catch(e){}fit();}
  bt.onclick=function(){set('tel')};bp.onclick=function(){set('pc')};
  window.addEventListener('resize',fit);
  document.getElementById('pg').addEventListener('load',function(){
    try{var t=this.contentDocument.title;if(t)document.getElementById('nome').textContent=t.replace(/^Wireframe · /,'');}catch(e){}
  });
  fit();
})();
</script>
</body>
</html>
